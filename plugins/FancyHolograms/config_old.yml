settings:
  spawn_delay_on_join_ms: 300 # The delay after player join before holograms are spawned, in milliseconds.
  visibility_distance: 20 # The default visibility distance for holograms.
  logging:
    version_notification: false # Whether version notifications are muted.
    level: INFO # The log level for the plugin (DEBUG, INFO, WARN, ERROR).
  saving:
    autosave:
      enabled: true # Whether autosave is enabled.
      interval: 15 # The interval at which autosave is performed in minutes.
    save_on_changed: true # Whether the plugin should save holograms when they are changed.
  register_commands: true # Whether the plugin should register its commands.
  language: default # The language to use for the plugin.
experimental_features:
  use_lamp_commands: false # Use the new commands made with the Lamp framework.
  disable_holograms_for_old_clients: false # Do not show holograms to clients with a version older than 1.19.4.
  disable_holograms_for_bedrock_players: false # Do not show holograms to bedrock players,
  enable_rotation_improvement: false # When enabled, hologram rotation will be done on display entities instead of the normal entity location
  enable_folia_visibility_fix: false # When enabled, all holograms will respawn after 100ms when they should spawn
performance:
  hologram_update_interval_ms: 200 # The interval at which holograms check for text updates (in milliseconds). Lower values = more responsive but higher CPU usage. Recommended: 200-500ms
config_version: 0
